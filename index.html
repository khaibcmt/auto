    <script>
      window.__loadAutotyperFallback = function () {
        if (window.__AUTOTYPER_BOOTED__ || window.__AUTOTYPER_FALLBACK_LOADING__) return;
        window.__AUTOTYPER_FALLBACK_LOADING__ = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './docs/assets/app.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.src = './docs/assets/app.js';
        document.body.appendChild(js);
      };
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__AUTOTYPER_BOOTED__) {
            window.__loadAutotyperFallback();
          }
        }, 150);
      });
    </script>
  </head>
  <body class="light-blue-3d-theme antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadAutotyperFallback()"></script>
