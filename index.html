    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      window.__loadAutotyperFallback = function () {
        if (window.__AUTOTYPER_BOOTED__ || window.__AUTOTYPER_FALLBACK_LOADING__) return;
        window.__AUTOTYPER_FALLBACK_LOADING__ = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './docs/assets/app.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.src = './docs/assets/app.js';
        document.body.appendChild(js);
      };
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__AUTOTYPER_BOOTED__) {
            window.__loadAutotyperFallback();
          }
        }, 150);
      });
    </script>
  </head>
  <body class="light-blue-3d-theme antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadAutotyperFallback()"></script>
  <script>
// 1. Chặn các phím tắt mở bảng lập trình (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
    ) {
        e.preventDefault();
        alert('Tính năng này đã bị khóa để bảo vệ bản quyền!');
        return false;
    }
});

// 2. Chặn bấm chuột phải để xem mã nguồn
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('Bản quyền thuộc về Thầy Hồ Tấn Khải - THPT Mang Thít!');
});

// 3. Hệ thống tự động kiểm tra bảo vệ bản quyền (Chống xóa tên tác giả)
setInterval(function() {
    // Kiểm tra xem dòng tên tác giả còn hiển thị trên web không
    const bodyText = document.body.innerText;
    if (!bodyText.includes('Hồ Tấn Khải') && !bodyText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh;">CẢNH BÁO: Trang web đã bị chỉnh sửa trái phép! Vui lòng giữ nguyên thông tin bản quyền của tác giả Hồ Tấn Khải.</h1>';
    }
}, 2000);
</script>
  <script>
// 1. Chặn các phím tắt và chuột phải ngầm định (Không hiện bảng thông báo gây phiền)
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
    ) {
        e.preventDefault();
        return false;
    }
});

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

// 2. Tự động kiểm tra bản quyền (Chống xóa tên tác giả Hồ Tấn Khải)
setInterval(function() {
    const bodyText = document.body.innerText;
    if (!bodyText.includes('Hồ Tấn Khải') && !bodyText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh;">CẢNH BÁO: Trang web đã bị chỉnh sửa trái phép! Vui lòng giữ nguyên thông tin bản quyền của tác giả Hồ Tấn Khải.</h1>';
    }
}, 2000);
</script>
